name: Build macOS Universal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-universal:
    name: macOS Intel + Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Universal App
        run: |
          cmake -S . -B build -G Xcode \
            -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$(find build -path '*/Release/*.app' -type d -prune -print -quit)"
          if [[ -z "$app" ]]; then
            echo 'No .app bundle found' >&2
            exit 1
          fi
          echo "Found app: $app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          echo 'Binary architectures:'
          lipo -archs "$app/Contents/MacOS/$executable"
          archs="$(lipo -archs "$app/Contents/MacOS/$executable")"
          [[ " $archs " == *' arm64 '* && " $archs " == *' x86_64 '* ]] || {
            echo 'Universal binary lacks arm64 or x86_64!' >&2
            exit 1
          }
          # Ad-hoc signing for developer testing, NOT Apple Developer ID notarization.
          codesign --force --deep --sign - "$app"
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent "$app" package/SkizoDroidLive-macOS-Universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SkizoDroidLive-macOS-Universal
          path: package/SkizoDroidLive-macOS-Universal.zip
          if-no-files-found: error
          retention-days: 30
