name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SkizoDroidLive-Windows
          path: build/SkizoDroidLive_artefacts/Release/**
